<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        form {
            background: white;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        .delete-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .delete-btn:hover {
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <h1>Student Management System</h1>

    <!-- Add Student Form -->
    <form action="/add" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Student Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="text"
            name="course"
            placeholder="Course"
            required
        >

        <input
            type="number"
            name="age"
            placeholder="Age"
            required
        >

        <button type="submit">Add Student</button>

    </form>


    <!-- Student Table -->
    <table>

        <thead>
            <tr>
                <th>Sl. No.</th>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>Age</th>
                <th>Delete</th>
            </tr>
        </thead>

        <tbody>

            <% students.forEach((student, index) => { %>

                <tr>

                    <!-- Automatic serial number -->
                    <td><%= index + 1 %></td>

                    <td><%= student.name %></td>

                    <td><%= student.email %></td>

                    <td><%= student.course %></td>

                    <td><%= student.age %></td>

                    <td>

                        <form
                            action="/delete/<%= student.id %>"
                            method="POST"
                            style="margin: 0; padding: 0;"
                        >

                            <button
                                type="submit"
                                class="delete-btn"
                                onclick="return confirm('Are you sure you want to delete this student?')"
                                title="Delete"
                            >
                                🗑️
                            </button>

                        </form>

                    </td>

                </tr>

            <% }); %>

        </tbody>

    </table>

</body>
</html>
